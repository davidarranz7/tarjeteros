name: Comprobar Angular y tarjetas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar banco de tarjetas
        run: npm run check:cards
      - name: Probar repaso espaciado
        run: npm run test:logic
      - name: Compilar en producción
        run: npm run build
