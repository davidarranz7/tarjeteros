<app-header title="Ajustes"/>
<main class="page with-header settings-page">
  <section class="profile-card"><div class="avatar large">JD</div><div><strong>Java Developer</strong><span>Formación backend · Módulo 1</span></div></section>
  <h3 class="settings-label">ESTUDIO</h3>
  <div class="settings-group">
    <div class="setting-row"><div><strong>Objetivo diario</strong><span>Tarjetas que quieres revisar al día</span></div>
      <select aria-label="Objetivo diario" [value]="prefs.values().goal" (change)="setGoal($event)"><option [value]="5">5</option><option [value]="10">10</option><option [value]="20">20</option></select>
    </div>
    <div class="setting-row"><div><strong>Priorizar falladas</strong><span>Repite antes las tarjetas difíciles</span></div>
      <button type="button" class="toggle" [class.on]="prefs.values().priority" [attr.aria-pressed]="prefs.values().priority" aria-label="Priorizar falladas" (click)="prefs.setPriority(!prefs.values().priority)"><i></i></button>
    </div>
  </div>
  <h3 class="settings-label">APARIENCIA</h3><div class="settings-group"><div class="setting-row"><div class="setting-with-icon">
    <span class="setting-icon"><app-icon [name]="progress.theme()==='dark'?'moon':'sun'" [size]="19"/></span>
    <div><strong>Modo oscuro</strong><span>Más cómodo con poca luz</span></div></div>
    <button type="button" class="toggle" [class.on]="progress.theme()==='dark'" [attr.aria-pressed]="progress.theme()==='dark'" aria-label="Modo oscuro" (click)="progress.toggleTheme()"><i></i></button></div></div>
  <h3 class="settings-label">PROGRESO</h3><div class="settings-group">
    <button class="setting-row" type="button" (click)="progress.exportFile()"><div class="setting-with-icon">
      <span class="setting-icon"><app-icon name="refresh" [size]="19"/></span><div><strong>Exportar progreso</strong><span>Guarda una copia de tus estadísticas</span></div></div>
      <app-icon name="chevron" [size]="18"/></button>
    <label class="setting-row" for="import-backup"><div class="setting-with-icon"><span class="setting-icon"><app-icon name="layers" [size]="19"/></span>
      <div><strong>Importar progreso</strong><span>Recupera una copia de seguridad</span></div></div><app-icon name="chevron" [size]="18"/></label>
    <input id="import-backup" type="file" accept="application/json,.json" hidden (change)="import($event)"/>
    <button class="setting-row reset" type="button" (click)="reset()"><div class="setting-with-icon">
      <span class="setting-icon danger"><app-icon name="trash" [size]="19"/></span>
      <div><strong>Reiniciar progreso</strong><span>Elimina estadísticas y respuestas</span></div></div><app-icon name="chevron" [size]="18"/></button>
  </div>
  @if(notice()){<p class="message-line" role="status">{{notice()}}</p>}
  <p class="version">Plexus Backend Trainer · Angular · versión 3.0</p>
</main>
